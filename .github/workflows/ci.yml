name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      # The data pages are `force-dynamic`, so the production build never connects
      # to a database — this dummy URL only satisfies Prisma's datasource parsing
      # (`prisma generate` runs on postinstall).
      DATABASE_URL: postgresql://user:pass@localhost:5432/agentmarket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
