services:
  db:
    image: postgres:16-alpine
    container_name: agentmarket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentmarket
    ports:
      - "5432:5432"
    volumes:
      - agentmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentmarket_pgdata:
